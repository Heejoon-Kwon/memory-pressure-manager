watch:
  interval_seconds: 5
  critical_available_percent: 8
  consecutive_samples: 3
  verification_seconds: 25
  cooldown_seconds: 90
  allow_force_kill: true
  force_kill_after_seconds: 8
  systemd_oom_preference: true
openai:
  api_key: ""
  model: gpt-6-luna
  monthly_budget_usd: 0

memory_optimization:
  proactive_reclaim: true
  reclaim_batch_mib: 64
  zram:
    size_percent: 50
    max_mib: 8192
    compression: zstd
