<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Probe 탭 관리</title><link rel="stylesheet" href="popup.css"></head>
<body><header><div><small>PROBE</small><h1>탭 메모리 관리</h1></div><button id="refresh" title="새로고침">↻</button></header>
<p id="status" class="status">연결 확인 중…</p><p class="hint">기본 우선순위는 500입니다. 필요한 탭만 보호를 켜세요. 숫자가 클수록 먼저 메모리에서 내립니다. 켜진 탭은 닫히지 않으며 선택하면 다시 로드됩니다.</p>
<p class="hint">활성·고정·소리 재생 중인 탭과 시크릿 탭은 제외합니다. 저장하지 않은 입력 내용은 사라질 수 있습니다.</p>
<div id="tabs"></div><p id="empty" hidden>열려 있는 탭이 없습니다.</p><p class="hint">설정은 현재 Chrome 세션의 탭과 현재 주소에만 적용됩니다. 주소가 바뀌거나 브라우저를 다시 시작하면 기본 우선순위 500으로 돌아갑니다.</p><script src="popup.js"></script></body></html>
